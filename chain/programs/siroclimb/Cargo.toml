[package]
name = "siroclimb"
version = "0.1.0"
description = "Siroclimb: leveraged stair climbs on live prices, played on MagicBlock Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "siroclimb"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
magicblock-magic-program-api = "0.10.1"
solana-sha256-hasher = "3.1.0"
bincode = "1.3.3"
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
